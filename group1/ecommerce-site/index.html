<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Ecommerce Site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Welcome to OnlineShoping</h1>
            <p>Discover amazing products at great prices.</p>
            <a href="shop.html"><button>Shop Now</button></a>
        </section>
        <section id="featured">
            <h2>Featured Products</h2>
            <div class="product-grid" id="featured-products">
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Ecommerce Site. All rights reserved.</p>
    </footer>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script>
        const featuredContainer = document.getElementById('featured-products');
        const featured = products.slice(0, 6); // First 6 products
        featured.forEach(product => {
            const averageRating = getAverageRating(product.id);
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <div class="product-rating">
                    <span class="stars">${renderStars(averageRating)}</span>
                    <span class="rating-text">(${averageRating.toFixed(1)})</span>
                </div>
                <p>M${product.price}</p>
                <button onclick="addToCart(${product.id})">Add to Cart</button>
            `;
            featuredContainer.appendChild(card);
        });

        function getAverageRating(productId) {
            const reviews = JSON.parse(localStorage.getItem('reviews') || '{}');
            const userRatings = JSON.parse(localStorage.getItem('userRatings') || '{}');
            const productReviews = reviews[productId] || [];
            const productUserRatings = userRatings[productId] || [];
            
            const allRatings = [...productReviews.map(r => r.rating), ...productUserRatings];
            
            if (allRatings.length === 0) return 0;
            const sum = allRatings.reduce((acc, rating) => acc + rating, 0);
            return sum / allRatings.length;
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
            return '★'.repeat(fullStars) + (hasHalfStar ? '☆' : '') + '☆'.repeat(emptyStars);
        }
    </script>
</body>
</html>
